<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script>
        console.log('📍 HTML 로드 시작...');
    </script>
    <script src="https://unpkg.com/three@r128/build/three.min.js" onload="console.log('✅ THREE.js 로드됨')" onerror="console.error('❌ THREE.js 로드 실패')"></script>
    <script src="https://unpkg.com/three@r128/examples/js/loaders/GLTFLoader.js" onload="console.log('✅ GLTFLoader 로드됨')" onerror="console.error('❌ GLTFLoader 로드 실패')"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading"><p>로딩 중...</p></div>
    <script>
        let scene, camera, renderer, model, mixer, animationClip;
        let isWalking = false;
        let animations = [];
        let animationMixer = null;
        let clock = new THREE.Clock();

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.pixelRatio = window.devicePixelRatio;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(5, 10, 7);
            scene.add(light1);

            const light2 = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(light2);

            // Handle window resize
            window.addEventListener('resize', onWindowResize);

            // Handle click events
            document.addEventListener('click', () => {
                window.parent.postMessage({ type: 'toggle' }, '*');
            });

            animate();
        }

        function loadModelFromData(modelData) {
            document.getElementById('loading').style.display = 'block';

            // Convert data URL to ArrayBuffer
            const arr = modelData.split(',');
            const bstr = atob(arr[1]);
            const n = bstr.length;
            const u8arr = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                u8arr[i] = bstr.charCodeAt(i);
            }

            loadGLTF(u8arr.buffer);
        }

        function loadModelFromURL(modelPath) {
            document.getElementById('loading').style.display = 'block';
            const loader = new THREE.GLTFLoader();
            loader.load(modelPath, (gltf) => {
                loadGLTFScene(gltf);
            }, undefined, (error) => {
                console.error('Error loading model:', error);
                document.getElementById('loading').style.display = 'none';
            });
        }

        function loadGLTF(buffer) {
            const loader = new THREE.GLTFLoader();
            loader.parse(buffer, '', (gltf) => {
                loadGLTFScene(gltf);
            }, undefined, (error) => {
                console.error('Error loading model:', error);
                document.getElementById('loading').style.display = 'none';
            });
        }

        function loadGLTFScene(gltf) {
            if (model) {
                scene.remove(model);
                if (animationMixer) {
                    animationMixer.stopAllAction();
                }
            }

            model = gltf.scene;
            scene.add(model);

            // Get animations
            if (gltf.animations && gltf.animations.length > 0) {
                animations = gltf.animations;
                animationMixer = new THREE.AnimationMixer(model);
            }

            // Center and scale model
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 1.5 / maxDim;

            model.position.sub(center.multiplyScalar(scale));
            model.scale.multiplyScalar(scale);

            document.getElementById('loading').style.display = 'none';
        }

        function animate() {
            requestAnimationFrame(animate);

            if (animationMixer) {
                animationMixer.update(clock.getDelta());
            }

            // Auto-rotate when walking
            if (model && isWalking) {
                model.rotation.y += 0.02;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function toggleAnimation() {
            isWalking = !isWalking;
            if (animationMixer && animations.length > 0) {
                if (isWalking) {
                    const action = animationMixer.clipAction(animations[0]);
                    action.loop = THREE.LoopRepeat;
                    action.clampWhenFinished = false;
                    action.play();
                } else {
                    animationMixer.stopAllAction();
                }
            }
            window.parent.postMessage({ type: 'animationToggled', walking: isWalking }, '*');
        }

        // Wait for THREE.js to load
        function waitForThree() {
            if (typeof THREE !== 'undefined') {
                console.log('THREE.js loaded');
                init();

                // Check for model URL parameter (웹 기반 방식)
                const urlParams = new URLSearchParams(window.location.search);
                const modelParam = urlParams.get('model');
                if (modelParam) {
                    const modelPath = modelParam.startsWith('http') ? modelParam : `models/${modelParam}.glb`;
                    loadModelFromURL(modelPath);
                }
            } else {
                console.log('Waiting for THREE.js...');
                setTimeout(waitForThree, 100);
            }
        }

        // Start waiting for THREE.js
        waitForThree();

        // Listen for messages from Flutter
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'loadModel') {
                loadModelFromData(event.data.modelData);
            } else if (event.data && event.data.type === 'toggleAnimation') {
                toggleAnimation();
            }
        });

        // Notify Flutter that viewer is ready
        window.parent.postMessage({ type: 'ready' }, '*');
    </script>
</body>
</html>
