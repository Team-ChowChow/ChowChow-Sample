<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@r128/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@r128/examples/jsm/"
        }
    }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: #f5f5f5;
        }
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #FF7000;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="status" id="status">로딩 중...</div>
    <model-viewer id="viewer" loading="eager" camera-controls interaction-prompt="none"></model-viewer>
    <div class="controls">
        <button id="toggleBtn">🚶 걷기</button>
    </div>

    <script type="module">
        const viewer = document.getElementById('viewer');
        const toggleBtn = document.getElementById('toggleBtn');
        const status = document.getElementById('status');

        let isWalking = false;
        let mixer = null;
        let actions = [];

        // URL 파라미터에서 모델 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const modelParam = urlParams.get('model');
        const modelPath = modelParam || 'character_group_1.glb';

        console.log('📡 모델 로드:', modelPath);
        viewer.src = modelPath;

        // 모델 로드 완료
        viewer.addEventListener('load', () => {
            console.log('✅ 모델 로드 완료');
            status.textContent = '✅ 로드 완료';

            // GLTF 정보 가져오기
            const model = viewer.model;
            console.log('📦 모델:', model);
        });

        // 로드 에러
        viewer.addEventListener('error', (e) => {
            console.error('❌ 로드 실패:', e);
            status.textContent = '❌ 로드 실패';
        });

        // 걷기 애니메이션 토글
        toggleBtn.addEventListener('click', () => {
            isWalking = !isWalking;
            viewer.setAttribute('auto-rotate', isWalking ? 'true' : 'false');
            toggleBtn.textContent = isWalking ? '⏸️ 정지' : '🚶 걷기';
            console.log('🎬 애니메이션:', isWalking ? '재생' : '정지');
        });

        // 터치/클릭으로 토글
        viewer.addEventListener('click', () => {
            toggleBtn.click();
        });
    </script>
</body>
</html>
