<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 펫</title>
    <style>
        * { margin: 0; padding: 0; }
        body { width: 100%; height: 100vh; background: #f5f5f5; font-family: sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        #info { position: fixed; top: 20px; left: 20px; background: white; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div id="info">🐕 로딩 중...</div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, model;
        const groupNum = new URLSearchParams(window.location.search).get('model') || '1';

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.pixelRatio = window.devicePixelRatio;
            document.body.appendChild(renderer.domElement);

            // 조명
            const light1 = new THREE.DirectionalLight(0xffffff, 1);
            light1.position.set(5, 10, 7);
            scene.add(light1);

            const light2 = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(light2);

            window.addEventListener('resize', onWindowResize);

            loadModel();
            animate();
        }

        function loadModel() {
            const paths = [
                'assets/models/character_group_1.glb',
                'assets/models/character_group_2.glb',
                'assets/models/character_group_3.glb',
                'assets/models/character_group_4.glb',
                'assets/models/character_group_5.glb',
                'assets/models/character_group_6.glb',
                'assets/models/character_group_7.glb',
            ];

            const modelPath = paths[Math.min(parseInt(groupNum) - 1, 6)];
            console.log('📡 로딩:', modelPath);
            document.getElementById('info').textContent = '⏳ 로딩 중...';

            // GLTFLoader 동적 로드
            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.min.js';
            script.onload = () => {
                const loader = new THREE.GLTFLoader();
                loader.load(
                    modelPath,
                    (gltf) => {
                        if (model) scene.remove(model);
                        model = gltf.scene;
                        scene.add(model);

                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        const scale = 2 / Math.max(size.x, size.y, size.z);

                        model.position.sub(center.multiplyScalar(scale));
                        model.scale.multiplyScalar(scale);

                        document.getElementById('info').textContent = '✅ 완료';
                    },
                    undefined,
                    (err) => {
                        console.error('❌', err);
                        document.getElementById('info').textContent = '❌ 로드 실패';
                    }
                );
            };
            document.head.appendChild(script);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
